[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-core"
version = "0.1.0"
description = "Reusable RAG primitives extracted from DominicBE"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109,<0.111",
    "uvicorn>=0.27,<0.30",
    "gunicorn>=22,<23",
    "httpx>=0.27,<0.28",
    "qdrant-client>=1.13,<1.15",
    # RCSI-P2-T01: PostgreSQL metadata DB (rag_core database — separate from chatbot_db)
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    # RCSI-P4-T02/T05: rag-core-owned source file storage and multipart intake
    "boto3>=1.34,<2.0",
    "python-multipart>=0.0.9,<1.0",
    # RCSI-P5-T01: Celery + Redis for rag-core async worker (separate from DominicBE)
    "celery[redis]>=5.3,<6.0",
    "redis>=5.0,<6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
