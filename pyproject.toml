[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-core"
version = "0.1.0"
description = "Reusable RAG primitives extracted from DominicBE"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109,<0.111",
    "uvicorn>=0.27,<0.30",
    "gunicorn>=22,<23",
    "httpx>=0.27,<0.28",
    "qdrant-client>=1.13,<1.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
